name: Deploy Nutriwell Store to VPS

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  deploy:
    name: SSH & Deploy Docker Stack
    runs-on: ubuntu-latest

    steps:
      - name: Execute Remote SSH Commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e
            echo "🚀 Navigating to project directory..."
            cd ${{ secrets.SERVER_PROJECT_PATH || '/opt/nutriwell' }}
            
            echo "📥 Pulling latest changes from git..."
            git pull origin $(git rev-parse --abbrev-ref HEAD)
            
            echo "🐳 Detecting Docker Compose command..."
            if command -v docker-compose &> /dev/null; then
              DOCKER_COMPOSE="docker-compose"
            else
              DOCKER_COMPOSE="docker compose"
            fi
            
            echo "🐳 Rebuilding and restarting Docker containers using '$DOCKER_COMPOSE'..."
            $DOCKER_COMPOSE down
            $DOCKER_COMPOSE up -d --build
            
            echo "🧹 Cleaning up unused Docker images..."
            docker image prune -f
            
            echo "✅ Deployment completed successfully!"
