version: '3.8'

services:
  db:
    image: mysql:5.7
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-nutriwell}
      MYSQL_USER: ${DB_USER:-nutriwell}
      MYSQL_PASSWORD: ${DB_PASSWORD:-nutriwell_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./nutriwell_backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${DB_USER:-nutriwell}
      DB_PASSWORD: ${DB_PASSWORD:-nutriwell_password}
      DB_NAME: ${DB_NAME:-nutriwell}
      PORT: ${BACKEND_PORT:-3001}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3001}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3001:3001"

  frontend:
    build:
      context: ./nutriwell_frotend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  db_data:
